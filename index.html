#app.enter>:nth-child(2){animation-delay:.07s}#app.enter>:nth-child(3){animation-delay:.14s}#app.enter>:nth-child(4){animation-delay:.21s}#app.enter>:nth-child(5){animation-delay:.28s}#app.enter>:nth-child(6){animation-delay:.35s}#app.enter>:nth-child(7){animation-delay:.42s}
#app.enter .item:nth-child(2){animation-delay:.16s}#app.enter .item:nth-child(3){animation-delay:.22s}#app.enter .item:nth-child(4){animation-delay:.28s}#app.enter .item:nth-child(5){animation-delay:.34s}#app.enter .item:nth-child(6){animation-delay:.4s}

@keyframes pop{50%{transform:scale(1.3)}}
@keyframes drift{to{transform:translate3d(6%,4%,0) scale(1.12)}}

@keyframes shine{to{background-position:300% 0}}
@keyframes glow{50%{box-shadow:0 0 26px rgb(var(--rgb)/.4)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgb(var(--rgb)/.55)}70%,100%{box-shadow:0 0 0 12px rgb(var(--rgb)/0)}}
@keyframes float{to{transform:translate(-18px,20px) scale(1.15)}}
@keyframes bob{to{transform:translateY(-4px) rotate(4deg)}}
@keyframes sk{to{background-position:-300% 0}}
.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

 c3d:"3D водяные знаки",c2d:"2D водяные знаки",cout:"Аутро",designs:"работ",fromS:"от",tapFull:"Нажмите на видео для полного экрана"}};
let L = store("l", tg.initDataUnsafe?.user?.language_code === "ru" ? "ru" : "en"), TH = store("th", "ocean"), AN = store("an", "1") === "1";
const t = k => T[L][k] || k;
let S = null, P = [], view = "home", cat = "3d", R = {reviews: [], avg: null}, lastErr = "", failed = false;
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const BASE = API.replace(/\/api$/, ""), vid = p => BASE + p.video, title = p => p.title[L] || p.title.en;
const disc = () => Math.min(90, S.shop + S.pers);
const usd = p => (price(p) * S.usd_cents / 100).toFixed(2);
const price = p => Math.max(1, Math.ceil(p.stars * (100 - disc()) / 100));
const cnt = n => L === "ru" ? `${n} ${n % 10 === 1 && n % 100 !== 11 ? "работа" : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? "работы" : "работ"}` : `${n} ${n === 1 ? "design" : "designs"}`;
const fmtDate = ms => new Date(ms * 1000).toLocaleString(L === "ru" ? "ru" : "en", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});

function toast(m, ms = 2200) { const e = $("#toast"); e.textContent = m; e.classList.add("on"); setTimeout(() => e.classList.remove("on"), ms); }
function applyPrefs() {
  const r = document.documentElement; r.dataset.theme = TH; r.classList.toggle("calm", !AN);
  try { const bg = getComputedStyle(r).getPropertyValue("--bg").trim(); tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
}
async function api(a, d = {}) {
  try {
    const r = await fetch(API, {method: "POST", headers: {"Content-Type": "application/json", "ngrok-skip-browser-warning": "1"}, body: JSON.stringify({a, init: tg.initData, ...d})});
    const j = await r.json(); if (j.state) { S = j.state; P = S.products; } if (j.err) { lastErr = "Server answered: " + j.err; toast(t(j.err)); } return j;
  } catch (e) { lastErr = "Network error (" + API + "): " + e.message; toast("Network error"); return {}; }
}
function confetti() {
  if (document.documentElement.classList.contains("calm")) return;
  const box = document.createElement("div"); box.className = "cf"; document.body.append(box);
  const cols = ["var(--acc)", "var(--acc2)", "var(--ok)", "#fff", "#ffd166"], rn = n => (Math.random() - .5) * n;
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("i"); s.style.cssText = `left:${50 + rn(20)}%;top:55%;background:${cols[i % 5]}`; box.append(s);
    s.animate([{transform: "translate(0,0) rotate(0)", opacity: 1}, {transform: `translate(${rn(340)}px,${-120 - Math.random() * 260}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: .6},
      {transform: `translate(${rn(420)}px,${160 + Math.random() * 200}px) rotate(${Math.random() * 900}deg)`, opacity: 0}], {duration: 1400 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.3,1)", fill: "forwards"});
  }
  setTimeout(() => box.remove(), 2300);
}
const blobs = {};
async function getBlob(u) {
  if (!blobs[u]) { const r = await fetch(u, {headers: {"ngrok-skip-browser-warning": "1"}}); if (!r.ok) throw 0; blobs[u] = URL.createObjectURL(await r.blob()); }
  return blobs[u];
}
async function loadVideos() {
  await Promise.all([...document.querySelectorAll("video[data-src]")].map(async v => {
    try { v.onloadeddata = () => v.parentElement.classList.add("ready"); v.src = await getBlob(v.dataset.src); v.play().catch(() => {}); } catch (e) {}
  }));
}
async function zoom(id) {
  const p = P.find(x => x.id === id); let src; try { src = await getBlob(vid(p)); } catch (e) { src = vid(p); }
  const el = document.createElement("div"); el.className = "lb";
  el.innerHTML = `<button class="lbx" aria-label="Close">✕</button><video src="${src}" autoplay loop playsinline controls></video><p>${esc(title(p))}</p>`;
  document.body.append(el); try { tg.requestFullscreen && tg.requestFullscreen(); } catch (e) {}
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 250); try { tg.exitFullscreen && tg.exitFullscreen(); } catch (e) {} };
  el.onclick = e => { if (e.target.tagName !== "VIDEO") close(); };
}

function enter() { app.classList.add("enter"); setTimeout(() => app.classList.remove("enter"), 1100); }
function go(v, c) { enter(); view = v; if (c) cat = c; draw(); scrollTo(0, 0); }
const back = () => `<button class="back" onclick="go('home')">${t("back")}</button>`;
const card = (ic, tt, sub, fn, cls = "", d = 0) => `<button class="big ${cls}" onclick="${fn}"><i class="ic" style="--d:${d}s">${ic}</i><div><b>${tt}</b><span>${sub}</span></div><em>›</em></button>`;
const openLink = u => u.includes("t.me/") ? tg.openTelegramLink(u) : tg.openLink(u);

function draw() {
  $("#en").classList.toggle("on", L === "en"); $("#ru").classList.toggle("on", L === "ru"); document.documentElement.lang = L;
  if (!S) { app.innerHTML = failed ? `<p class="note">${t("offline")}<br><br><small>${esc(lastErr)}</small></p><button class="btn" onclick="boot()">${t("retry")}</button>` :
    `<div class="sk" style="height:150px"></div><div class="sk" style="height:78px"></div><div class="sk" style="height:78px"></div><div class="sk" style="height:78px"></div>`; return; }
  ({home, cat: catView, rew, rev})[view]();
}

function home() {
  const cc = CATS.map(([k, ic, tk], i) => { const l = P.filter(p => p.category === k), m = l.length ? Math.min(...l.map(price)) : 0;
    return card(ic, t(tk), l.length ? `${cnt(l.length)} · ${t("fromS")} ${m} ⭐` : t("soon"), `go('cat','${k}')`, i === 0 ? "first" : "", i * .6); }).join("");
  app.innerHTML = `
  <div class="hero"><span class="badge">${t("heroB")}</span><h2>${t("heroT")}</h2><p>${t("heroS")}</p><div class="chips"><span>${t("f1")}</span><span>${t("f2")}</span><span>${t("f3")}</span></div></div>
  ${cc}<p class="sec">${t("more")}</p>
  ${card("🎁", t("rew"), `${t("wheel")} · ${t("ref")}`, "go('rew')", "", 1.8)}
  ${card("⭐", t("rev"), R.avg != null ? `${R.avg} / 10 ${t("avg")}` : t("none"), "openRev()", "", 2.4)}
  <p class="sec">${t("follow")}</p><div class="links">${LINKS.map(([n, u]) => `<button onclick="openLink('${u}')">${n}</button>`).join("")}</div>`;
}

function catView() {
  const c = CATS.find(x => x[0] === cat), list = P.filter(p => p.category === cat);
  app.innerHTML = back() + `<h2 class="ptitle">${c[1]} ${t(c[2])}</h2>` + (disc() ? `<p style="margin:6px 0 10px"><span class="tag">−${disc()}%</span> <span class="mut">${t("off")}</span></p>` : "") +
  (list.length ? `<p class="hint">${t("tapFull")}</p><div class="grid">${list.map(p => `<div class="item"><div class="vw" onclick="zoom('${p.id}')"><video data-src="${vid(p)}" autoplay muted loop playsinline></video><span class="exp">⤢</span>${disc() ? `<span class="tag corner">−${disc()}%</span>` : ""}</div>
    <div class="meta"><h3>${esc(title(p))}</h3>${p.colors ? `<span class="mini">🎨 ${t("colorsTag")}</span>` : ""}<span>${disc() ? `<span class="old">${p.stars} ⭐</span> ` : ""}<b>${price(p)} ⭐</b>${S.usd_on ? `<span class="mut"> · $${usd(p)}</span>` : ""}</span>
    <button class="btn" onclick="openOrder('${p.id}')">${t("order")}</button></div></div>`).join("")}</div>` :
    `<div class="empty"><i class="ic">${c[1]}</i><p class="mut">${t("emptyT")}</p></div>`);
  loadVideos();
}

function openOrder(id) {
  const p = P.find(x => x.id === id); let col = PRESETS[0];
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div><div class="grab"></div><h2>${esc(title(p))}</h2>
  <p class="mut">${t("name")}</p><input id="nm" maxlength="40" placeholder="${t("namePh")}" autocomplete="off" style="margin:6px 0 10px">
  ${p.colors ? `<p class="mut">${t("color")}</p><div class="sw">${PRESETS.map((c, i) => `<button class="dot ${i ? "" : "on"}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}<label class="dot cust" title="${t("custom")}"><input type="color" id="cc" value="#ffffff"><span>+</span></label></div>` : ""}
  <p class="mut">${t("fmt")}</p><div class="opt">${[["pc", "pc"], ["mobile", "mob"], ["both", "both"]].map(([v, k], i) => `<label><input type="radio" name="f" value="${v}" ${i ? "" : "checked"}><span>${t(k)}</span></label>`).join("")}</div>
  ${S.usd_on ? `<p class="mut">${t("payWith")}</p><div class="opt">${[["stars", "payStars"], ["usd", "payUsd"]].map(([v, k], i) => `<label><input type="radio" name="c" value="${v}" ${i ? "" : "checked"}><span>${t(k)}</span></label>`).join("")}</div>` : ""}
  <p class="pr" id="pr">${price(p)} ⭐</p><div class="note">${t("note")}</div>
  <button class="btn" id="go">${t("buy")}</button><button class="btn alt" style="margin-top:8px" id="x">✕</button></div>`;
  document.body.append(el);
  const dots = el.querySelectorAll(".dot"), pick = (d, c) => { dots.forEach(x => x.classList.remove("on")); d.classList.add("on"); col = c; };
  el.querySelectorAll(".dot[data-c]").forEach(d => d.onclick = () => pick(d, d.dataset.c));
  const cc = el.querySelector("#cc"); if (cc) cc.oninput = () => pick(cc.parentElement, cc.value);
  const upd = () => { const c = el.querySelector("input[name=c]:checked")?.value; $("#pr").textContent = c === "usd" ? "$" + usd(p) : price(p) + " ⭐"; };
  el.addEventListener("change", upd);
  $("#x").onclick = () => el.remove(); el.onclick = e => { if (e.target === el) el.remove(); };
  $("#go").onclick = async () => {
    const nm = $("#nm").value.trim(); if (!nm) return toast(t("nameReq"));
    $("#go").disabled = true; const pay = el.querySelector("input[name=c]:checked")?.value || "stars";
    const j = await api("order", {pid: id, fmt: el.querySelector("input[name=f]:checked").value, name: nm, color: p.colors ? col : "", pay});
    if (j.link && pay === "usd") { openLink(j.link); toast(t("usdWait"), 7000); el.remove(); }
    else if (j.link) tg.openInvoice(j.link, st => { if (st === "paid") { toast(t("done")); confetti(); el.remove(); } else $("#go").disabled = false; });
    else $("#go").disabled = false;
  };
}

function openSettings() {
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div><div class="grab"></div><h2>⚙ ${t("settings")}</h2><p class="mut">${t("theme")}</p>
  <div class="themes">${THEMES.map(([k, n, a, b]) => `<button class="th ${k === TH ? "on" : ""}" data-k="${k}"><i class="sq" style="background:linear-gradient(135deg,${a},${b})"></i><span>${t(n)}</span></button>`).join("")}</div>
  <p class="mut" style="margin-top:14px">${t("anim")}</p><button class="btn alt ${AN ? "on" : ""}" id="an" style="margin-top:6px">${AN ? "✓ " + t("on") : t("off2")}</button>
  <button class="btn alt" style="margin-top:14px" id="x">${t("close")}</button></div>`;
  document.body.append(el);
  el.querySelectorAll(".th").forEach(b => b.onclick = () => { TH = b.dataset.k; save("th", TH); applyPrefs(); el.querySelectorAll(".th").forEach(x => x.classList.toggle("on", x === b)); enter(); draw(); });
  $("#an").onclick = e => { AN = !AN; save("an", AN ? "1" : "0"); applyPrefs(); e.target.classList.toggle("on", AN); e.target.textContent = AN ? "✓ " + t("on") : t("off2"); };
  $("#x").onclick = () => el.remove(); el.onclick = e => { if (e.target === el) el.remove(); };
}

function rew() {
  const wLeft = S.wexp > Date.now() / 1000, idx = [10, 20, 30, 40, 50].indexOf(S.wp);
  app.innerHTML = back() + `<div class="box"><h2>🎡 ${t("wheel")}</h2><p class="mut">${t("wheelInfo")}</p>
   <div class="wheelwrap"><span class="ptr">▼</span><div class="wheel" id="wh" style="transform:rotate(${S.wheel_used ? 360 - (idx * 72 + 36) : 0}deg)">${[10, 20, 30, 40, 50].map((p, i) => `<span style="transform:rotate(${i * 72 + 36}deg) translateY(-62px)">${p}%</span>`).join("")}</div></div>
   <p style="text-align:center;min-height:28px;font-size:18px;font-weight:800;margin-top:6px">${S.wheel_used ? (wLeft ? `${t("active")}: −${S.wp}% ${t("until")} ${fmtDate(S.wexp)}` : "") : ""}</p>
   <button class="btn ${S.wheel_used ? "" : "pulse"}" style="margin-top:8px" ${S.wheel_used ? "disabled" : ""} onclick="spin()">${t("spin")}</button></div>
  <div class="box"><h2>🤝 ${t("ref")}</h2><p class="mut">${t("refInfo")}</p>
   <div class="row"><input readonly value="${S.code}"><button class="btn alt" style="width:auto;margin:0" onclick="navigator.clipboard?.writeText('${S.code}');toast(t('copy'))">⧉</button></div>
   ${S.ref_by ? `<p class="mut" style="margin-top:8px">${S.ref ? "✅ " + t("refOn") : ""}</p>` : `<div class="row"><input id="rc" placeholder="${t("enter")}"><button class="btn" style="width:auto;margin:0" onclick="applyRef()">${t("apply")}</button></div>`}</div>`;
}
async function spin() {
  const j = await api("wheel"); if (j.err) return draw();
  const i = [10, 20, 30, 40, 50].indexOf(j.won);
  $("#wh").style.transform = `rotate(${360 * 5 + 360 - (i * 72 + 36)}deg)`;
  setTimeout(() => { toast("🎉 −" + j.won + "%"); confetti(); draw(); }, 3400);
}
async function applyRef() { const j = await api("ref", {code: $("#rc").value}); if (!j.err) { toast("✅"); confetti(); } draw(); }

async function openRev() { const j = await api("reviews"); R = {reviews: j.reviews || [], avg: j.avg}; go("rev"); }
function rev() {
  app.innerHTML = back() + `<h2 style="margin-bottom:8px">⭐ ${t("rev")}${R.avg != null ? ` · ${R.avg}/10` : ""}</h2>` +
  (S.bought ? `<div class="box"><p class="mut">${t("rating")}</p><input id="rt" type="number" min="0" max="10" step="0.1" inputmode="decimal" value="${S.mine?.rating ?? ""}">
    <p class="mut" style="margin-top:8px">${t("text")}</p><textarea id="rx" rows="2" maxlength="300">${esc(S.mine?.text ?? "")}</textarea>
    <button class="btn" style="margin-top:10px" onclick="sendRev()">${t("send")}</button></div>` : `<p class="note">${t("revLock")}</p>`) +
  (R.reviews.length ? R.reviews.map(r => `<div class="rev"><b>${r.rating.toFixed(1)}</b> · ${esc(r.name)}<br>${esc(r.text || "")}</div>`).join("") : `<p class="mut">${t("none")}</p>`);
}
async function sendRev() { const j = await api("review", {rating: $("#rt").value, text: $("#rx").value}); if (!j.err) { toast(t("saved")); confetti(); openRev(); } }

for (const l of ["en", "ru"]) $("#" + l).onclick = () => { L = l; save("l", l); draw(); };
$("#cog").onclick = openSettings;
async function boot() {
  failed = false; draw(); await api("state"); failed = !S;
  if (S) { const j = await api("reviews"); R = {reviews: j.reviews || [], avg: j.avg}; }
  enter(); draw();
}
applyPrefs(); draw(); boot();
</script>
</body>
</html>
