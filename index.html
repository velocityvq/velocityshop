<style>

*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{color:var(--tx);font:15px/1.4 Sora,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,rgb(var(--rgb)/.2),transparent 70%),radial-gradient(45% 40% at 85% 80%,rgb(var(--rgb2)/.24),transparent 70%);animation:drift 16s ease-in-out infinite alternate}

header{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:14px 0}

.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;background:var(--card)}

#cog:active{transform:rotate(120deg) scale(.92)}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

.big:active,.item:active{transform:scale(.98)}
@media(hover:hover){.big:hover,.item:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgb(var(--rgb)/.3);border-color:var(--acc)}}
.ic{flex:none;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:25px;font-style:normal;background:linear-gradient(135deg,rgb(var(--rgb)/.22),rgb(var(--rgb2)/.22));border:1px solid var(--line);animation:bob 3.6s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
.big em{margin-left:auto;font-style:normal;color:var(--acc);font-size:24px;transition:transform .2s}.big:active em{transform:translateX(4px)}

.hero{position:relative;overflow:hidden;border-radius:20px;padding:20px 18px;margin-bottom:14px;background:linear-gradient(135deg,var(--hero1),var(--hero2) 60%,var(--card));border:1px solid var(--line)}

.hero>*{position:relative}.hero h2{font-size:22px;line-height:1.2;margin:6px 0 4px}.hero p{opacity:.8;font-size:13px}
.badge{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chips span{font-size:12px;border:1px solid rgb(var(--rgb)/.4);background:rgb(var(--rgb)/.12);border-radius:999px;padding:4px 10px}

.ptitle{font-size:20px;margin:0 0 4px}.hint{color:var(--mut);font-size:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.vw{position:relative;aspect-ratio:1;background:linear-gradient(100deg,var(--card) 30%,rgb(var(--rgb)/.16) 50%,var(--card) 70%);background-size:300% 100%;animation:sk 1.4s linear infinite;cursor:zoom-in}
.vw.ready{animation:none;background:#000}
.vw video{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}.vw.ready video{opacity:1}
.vw::after{content:"";position:absolute;inset:auto 0 0 0;height:35%;background:linear-gradient(transparent,var(--card));pointer-events:none}
.corner{position:absolute;left:8px;top:8px;z-index:1}
.exp{position:absolute;right:8px;top:8px;z-index:1;width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:rgb(0 0 0/.45);color:#fff;font-size:14px;backdrop-filter:blur(6px);transition:transform .2s}.vw:active .exp{transform:scale(1.2)}
.meta{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta h3{font-size:14px;font-weight:600}.old{color:var(--mut);text-decoration:line-through;font-size:12px}
.mini{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--mut)}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);border:0;border-radius:10px;padding:10px;font-weight:700;font-size:14px;width:100%;margin-top:auto;transition:transform .15s,filter .2s,opacity .2s}
.btn:active{transform:scale(.96)}@media(hover:hover){.btn:hover{filter:brightness(1.1)}}
.btn.alt{background:var(--line);color:var(--tx)}.btn.alt.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink)}.btn:disabled{opacity:.45}
.btn.pulse{animation:pulse 2s ease-out infinite}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.box h2{font-size:16px;margin-bottom:6px}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgb(var(--rgb)/.3)}
.tag{display:inline-block;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--ink);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgb(0 0 0/.6);display:flex;align-items:flex-end;z-index:5;animation:fade .25s both}
.sheet>div{background:var(--bg);border-top:1px solid var(--acc);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-height:92vh;overflow:auto;animation:slide .4s cubic-bezier(.2,.8,.2,1) both}
.sheet h2{margin-bottom:8px}.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.opt{display:flex;gap:8px;margin:8px 0}.opt label{flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-size:13px;transition:border-color .2s,background .2s,transform .15s}.opt label:active{transform:scale(.96)}
.opt input{display:none}.opt input:checked+span{color:var(--acc);font-weight:800}.opt label:has(input:checked){border-color:var(--acc);background:rgb(var(--rgb)/.12)}
.sw{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 12px}
.dot{width:30px;height:30px;border-radius:50%;border:0;outline:2px solid var(--line);outline-offset:2px;position:relative;display:grid;place-items:center;transition:transform .2s,outline-color .2s}
.dot.on{outline-color:var(--tx);transform:scale(1.14);animation:pop .3s}
.dot.cust{background:conic-gradient(#f33,#fd0,#3d5,#0dd,#36f,#d3f,#f33);overflow:hidden}.dot.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;cursor:pointer}.dot.cust span{pointer-events:none;color:#fff;font-weight:800;text-shadow:0 1px 3px #000}
.pr{font-size:22px;font-weight:800;margin:8px 0}
.note{background:rgb(255 193 7/.14);border:1px solid rgb(255 193 7/.5);border-radius:10px;padding:8px 10px;font-size:13px;margin:10px 0}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px;color:var(--tx);text-align:left;display:flex;gap:10px;align-items:center;font-size:13px;transition:transform .2s,border-color .2s,box-shadow .2s}.th:active{transform:scale(.96)}
.th.on{border-color:var(--acc);box-shadow:0 0 0 2px rgb(var(--rgb)/.3)}.sq{width:28px;height:28px;border-radius:9px;flex:none}
.rev{border-top:1px solid var(--line);padding:10px 0}.rev b{color:var(--ok)}
.wheelwrap{position:relative;width:176px;margin:14px auto 6px}
.wheel{position:relative;width:176px;height:176px;border-radius:50%;border:4px solid var(--bg);outline:2px solid var(--line);background:conic-gradient(var(--acc) 0 72deg,var(--acc2) 72deg 144deg,var(--ok) 144deg 216deg,#a78bfa 216deg 288deg,#f472b6 288deg 360deg);box-shadow:0 0 34px rgb(var(--rgb)/.4);transition:transform 3.2s cubic-bezier(.12,.7,.1,1)}
.wheel span{position:absolute;left:50%;top:50%;width:36px;margin:-9px 0 0 -18px;text-align:center;font-weight:800;font-size:13px;color:#06141f}
.wheel::after{content:"";position:absolute;inset:50% auto auto 50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--bg);border:2px solid var(--acc)}
.ptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:2;font-size:22px;color:var(--tx);filter:drop-shadow(0 2px 4px #0009)}
.empty{text-align:center;padding:40px 10px}.empty .ic{margin:0 auto 12px;width:64px;height:64px;font-size:30px}
.sk{border-radius:16px;margin-bottom:12px;background:linear-gradient(100deg,var(--card) 30%,rgb(var(--rgb)/.16) 50%,var(--card) 70%);background-size:300% 100%;animation:sk 1.4s linear infinite}
.lb{position:fixed;inset:0;z-index:30;background:rgb(0 0 0/.93);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;animation:fade .25s both}
.lb.out{animation:fadeout .25s both}.lb video{max-width:100%;max-height:80vh;border-radius:16px;animation:zoom .4s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 0 70px rgb(var(--rgb)/.4)}
.lb p{color:#fff;font-weight:600}.lbx{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));width:40px;height:40px;border-radius:50%;border:0;background:rgb(255 255 255/.15);color:#fff;font-size:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.cf i{position:absolute;width:8px;height:12px;border-radius:2px}
#app.enter>*:not(.grid),#app.enter .item{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
#app.enter>:nth-child(2){animation-delay:.07s}#app.enter>:nth-child(3){animation-delay:.14s}#app.enter>:nth-child(4){animation-delay:.21s}#app.enter>:nth-child(5){animation-delay:.28s}#app.enter>:nth-child(6){animation-delay:.35s}#app.enter>:nth-child(7){animation-delay:.42s}
#app.enter .item:nth-child(2){animation-delay:.16s}#app.enter .item:nth-child(3){animation-delay:.22s}#app.enter .item:nth-child(4){animation-delay:.28s}#app.enter .item:nth-child(5){animation-delay:.34s}#app.enter .item:nth-child(6){animation-delay:.4s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes slide{from{transform:translateY(100%)}}
@keyframes zoom{from{opacity:0;transform:scale(.8)}}
@keyframes pop{50%{transform:scale(1.3)}}
@keyframes drift{to{transform:translate3d(6%,4%,0) scale(1.12)}}
@keyframes grid{to{background-position:0 26px}}
@keyframes shine{to{background-position:300% 0}}
@keyframes glow{50%{box-shadow:0 0 26px rgb(var(--rgb)/.4)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgb(var(--rgb)/.55)}70%,100%{box-shadow:0 0 0 12px rgb(var(--rgb)/0)}}
@keyframes float{to{transform:translate(-18px,20px) scale(1.15)}}
@keyframes bob{to{transform:translateY(-4px) rotate(4deg)}}
@keyframes sk{to{background-position:-300% 0}}
.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

html{background:var(--bg)}body{font:17px/1.45 'EB Garamond',Georgia,serif}
h1,h2,.big b{font-family:'UnifrakturMaguntia','EB Garamond',serif;font-weight:400}
.sec,.btn,.badge,.lang button,.back,.tag{font-family:'Cinzel','EB Garamond',serif}
.mut,.big span,.note,.opt label,.th,.links button,.chips span{font-size:15px}.hint,.mini,.old,.hero p{font-size:14px}.meta h3{font-size:17px}
.big b{font-size:22px}.hero h2,.ptitle{font-size:28px}.box h2{font-size:22px}.badge{font-size:12px;letter-spacing:.16em}.sec{font-size:12px;letter-spacing:.18em}
#atmo{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}#atmo>*{position:absolute}
.orb{width:80vmax;height:80vmax;border-radius:50%;opacity:calc(.25 + var(--int)*.75);filter:hue-rotate(var(--h));transition:translate 2.4s var(--ease),filter 2.4s var(--ease)}
.o1{left:-30vmax;top:-30vmax;translate:var(--a) var(--b);background:radial-gradient(circle,rgb(var(--rgb)/.42),transparent 62%);animation:o1 24s ease-in-out infinite alternate}
.o2{right:-35vmax;bottom:-35vmax;translate:var(--c) var(--d);background:radial-gradient(circle,rgb(var(--rgb2)/.28),transparent 62%);animation:o2 30s ease-in-out infinite alternate}
@keyframes o1{to{transform:translate3d(8vw,6vh,0) scale(1.15)}}@keyframes o2{to{transform:translate3d(-9vw,-5vh,0) scale(1.1)}}
body{--a:0vw;--b:0vh;--c:0vw;--d:0vh;--h:0deg}
body[data-v="3d"]{--a:40vw;--b:12vh;--c:-18vw;--d:-20vh;--h:-24deg}body[data-v="2d"]{--a:10vw;--b:40vh;--c:-34vw;--d:-8vh;--h:26deg}
body[data-v=outro]{--a:30vw;--b:-8vh;--c:-10vw;--d:-34vh;--h:58deg}body[data-v=rew]{--a:44vw;--b:30vh;--c:-30vw;--d:-26vh;--h:-52deg}body[data-v=rev]{--a:4vw;--b:50vh;--c:-26vw;--d:2vh;--h:84deg}
.ray{top:-12vh;left:16%;width:34vw;height:140vh;transform-origin:50% 0;background:linear-gradient(rgb(var(--rgb2)/.2),transparent 75%);-webkit-mask-image:linear-gradient(90deg,transparent,#000,transparent);mask-image:linear-gradient(90deg,transparent,#000,transparent);opacity:calc(var(--int)*.8);animation:sway 14s ease-in-out infinite alternate}
.ray+.ray{left:58%;width:22vw;animation-duration:19s;animation-direction:alternate-reverse}@keyframes sway{from{transform:rotate(14deg)}to{transform:rotate(24deg)}}
#vig{inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgb(var(--vig)/.72) 100%)}
#candle{left:-30vmax;top:-30vmax;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,rgb(255 176 80/calc(.06 + var(--int)*.2)),transparent 62%);animation:flick 4.3s ease-in-out infinite}
@keyframes flick{0%{opacity:.75}12%{opacity:1}23%{opacity:.6}41%{opacity:.95}57%{opacity:.7}78%{opacity:1}100%{opacity:.8}}
#dust{inset:0;width:100%;height:100%}
#grain{inset:0;opacity:.1;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .8 0 0 0 0 .65 0 0 0 0 .4 0 0 0 .8 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.nograin #grain,.nocandle #candle{display:none}
body::after{inset:-60px 0 0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' fill='none' stroke='%23c9a24b' stroke-opacity='.4'><path d='M30 4 56 30 30 56 4 30Z'/><circle cx='30' cy='30' r='4'/></svg>");background-size:60px 60px;-webkit-mask-image:none;mask-image:none;opacity:.35;animation:lat 40s linear infinite}
@keyframes lat{to{transform:translate3d(0,60px,0)}}
.fc{position:fixed;width:88px;height:88px;z-index:1;pointer-events:none;fill:none;stroke:var(--acc);stroke-width:1.3;opacity:calc(.25 + var(--int)*.4);animation:breathe 6s ease-in-out infinite}
.fc.tl{left:0;top:env(safe-area-inset-top)}.fc.tr{right:0;top:env(safe-area-inset-top);transform:scaleX(-1)}.fc.bl{left:0;bottom:0;transform:scaleY(-1)}.fc.br{right:0;bottom:0;transform:scale(-1)}
@keyframes breathe{50%{opacity:.9}}@keyframes dim{50%{opacity:.5}}@keyframes floaty{to{transform:translateY(-3px) rotate(8deg)}}@keyframes spin{to{transform:rotate(360deg)}}
header{grid-template-columns:72px 1fr 72px}

  <div class="hero"><span class="badge">${t("heroB")}</span><h2>${t("heroT")}</h2><p>${t("heroS")}</p><div class="chips"><span>${t("f1")}</span><span>${t("f2")}</span><span>${t("f3")}</span></div></div>
  ${cc}<p class="sec">${t("more")}</p>
  ${card("🎁", t("rew"), `${t("wheel")} · ${t("ref")}`, "go('rew')", "", 1.8)}
  ${card("⭐", t("rev"), R.avg != null ? `${R.avg} / 10 ${t("avg")}` : t("none"), "openRev()", "", 2.4)}
  <p class="sec">${t("follow")}</p><div class="links">${LINKS.map(([n, u]) => `<button onclick="openLink('${u}')">${n}</button>`).join("")}</div>`;
}

function catView() {
  const c = CATS.find(x => x[0] === cat), list = P.filter(p => p.category === cat);
  app.innerHTML = back() + `<h2 class="ptitle">${c[1]} ${t(c[2])}</h2>` + (disc() ? `<p style="margin:6px 0 10px"><span class="tag">−${disc()}%</span> <span class="mut">${t("off")}</span></p>` : "") +
  (list.length ? `<p class="hint">${t("tapFull")}</p><div class="grid">${list.map(p => `<div class="item"><div class="vw" onclick="zoom('${p.id}')"><video data-src="${vid(p)}" autoplay muted loop playsinline></video><span class="exp">⤢</span>${disc() ? `<span class="tag corner">−${disc()}%</span>` : ""}</div>
    <div class="meta"><h3>${esc(title(p))}</h3>${p.colors ? `<span class="mini">🎨 ${t("colorsTag")}</span>` : ""}<span>${disc() ? `<span class="old">${p.stars} ⭐</span> ` : ""}<b>${price(p)} ⭐</b>${S.usd_on ? `<span class="mut"> · $${usd(p)}</span>` : ""}</span>
    <button class="btn" onclick="openOrder('${p.id}')">${t("order")}</button></div></div>`).join("")}</div>` :
    `<div class="empty"><i class="ic">${c[1]}</i><p class="mut">${t("emptyT")}</p></div>`);
  loadVideos();
}

function openOrder(id) {
  const p = P.find(x => x.id === id); let col = PRESETS[0];
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div><div class="grab"></div><h2>${esc(title(p))}</h2>
  <p class="mut">${t("name")}</p><input id="nm" maxlength="40" placeholder="${t("namePh")}" autocomplete="off" style="margin:6px 0 10px">
  ${p.colors ? `<p class="mut">${t("color")}</p><div class="sw">${PRESETS.map((c, i) => `<button class="dot ${i ? "" : "on"}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}<label class="dot cust" title="${t("custom")}"><input type="color" id="cc" value="#ffffff"><span>+</span></label></div>` : ""}
  <p class="mut">${t("fmt")}</p><div class="opt">${[["pc", "pc"], ["mobile", "mob"], ["both", "both"]].map(([v, k], i) => `<label><input type="radio" name="f" value="${v}" ${i ? "" : "checked"}><span>${t(k)}</span></label>`).join("")}</div>
  ${S.usd_on ? `<p class="mut">${t("payWith")}</p><div class="opt">${[["stars", "payStars"], ["usd", "payUsd"]].map(([v, k], i) => `<label><input type="radio" name="c" value="${v}" ${i ? "" : "checked"}><span>${t(k)}</span></label>`).join("")}</div>` : ""}
  <p class="pr" id="pr">${price(p)} ⭐</p><div class="note">${t("note")}</div>
  <button class="btn" id="go">${t("buy")}</button><button class="btn alt" style="margin-top:8px" id="x">✕</button></div>`;
  document.body.append(el);
  const dots = el.querySelectorAll(".dot"), pick = (d, c) => { dots.forEach(x => x.classList.remove("on")); d.classList.add("on"); col = c; };
  el.querySelectorAll(".dot[data-c]").forEach(d => d.onclick = () => pick(d, d.dataset.c));
  const cc = el.querySelector("#cc"); if (cc) cc.oninput = () => pick(cc.parentElement, cc.value);
  const upd = () => { const c = el.querySelector("input[name=c]:checked")?.value; $("#pr").textContent = c === "usd" ? "$" + usd(p) : price(p) + " ⭐"; };
  el.addEventListener("change", upd);
  $("#x").onclick = () => el.remove(); el.onclick = e => { if (e.target === el) el.remove(); };
  $("#go").onclick = async () => {
    const nm = $("#nm").value.trim(); if (!nm) return toast(t("nameReq"));
    $("#go").disabled = true; const pay = el.querySelector("input[name=c]:checked")?.value || "stars";
    const j = await api("order", {pid: id, fmt: el.querySelector("input[name=f]:checked").value, name: nm, color: p.colors ? col : "", pay});
    if (j.link && pay === "usd") { openLink(j.link); toast(t("usdWait"), 7000); el.remove(); }
    else if (j.link) tg.openInvoice(j.link, st => { if (st === "paid") { toast(t("done")); confetti(); el.remove(); } else $("#go").disabled = false; });
    else $("#go").disabled = false;
  };
}

function openSettings() {
  const el = document.createElement("div"); el.className = "sheet";
  el.innerHTML = `<div><div class="grab"></div><h2>⚙ ${t("settings")}</h2><p class="mut">${t("theme")}</p>
  <div class="themes">${THEMES.map(([k, n, a, b]) => `<button class="th ${k === TH ? "on" : ""}" data-k="${k}"><i class="sq" style="background:linear-gradient(135deg,${a},${b})"></i><span>${t(n)}</span></button>`).join("")}</div>
  <p class="mut" style="margin-top:14px">${t("anim")}</p><button class="btn alt ${AN ? "on" : ""}" id="an" style="margin-top:6px">${AN ? "✓ " + t("on") : t("off2")}</button>
  <p class="mut" style="margin-top:14px">${t("atmo")}</p><input type="range" id="int" min="0" max="100" value="${FX.int}">
  <div class="opt">${["dust", "candle", "grain"].map(k => `<label><input type="checkbox" id="f_${k}" ${FX[k] ? "checked" : ""}><span>${t(k)}</span></label>`).join("")}</div>
  <button class="btn alt" style="margin-top:14px" id="x">${t("close")}</button></div>`;
  document.body.append(el);
  el.querySelectorAll(".th").forEach(b => b.onclick = () => { TH = b.dataset.k; save("th", TH); applyPrefs(); el.querySelectorAll(".th").forEach(x => x.classList.toggle("on", x === b)); enter(); draw(); });
  $("#an").onclick = e => { AN = !AN; save("an", AN ? "1" : "0"); applyPrefs(); e.target.classList.toggle("on", AN); e.target.textContent = AN ? "✓ " + t("on") : t("off2"); };
  $("#int").oninput = e => { FX.int = +e.target.value; save("int", FX.int); fx(); };
  ["dust", "candle", "grain"].forEach(k => $("#f_" + k).onchange = e => { FX[k] = e.target.checked; save(k, FX[k] ? "1" : "0"); fx(); });
  $("#x").onclick = () => el.remove(); el.onclick = e => { if (e.target === el) el.remove(); };
}

function rew() {
  const wLeft = S.wexp > Date.now() / 1000, idx = [10, 20, 30, 40, 50].indexOf(S.wp);
  app.innerHTML = back() + `<div class="box"><h2>🎡 ${t("wheel")}</h2><p class="mut">${t("wheelInfo")}</p>
   <div class="wheelwrap"><span class="ptr">▼</span><div class="wheel" id="wh" style="transform:rotate(${S.wheel_used ? 360 - (idx * 72 + 36) : 0}deg)">${[10, 20, 30, 40, 50].map((p, i) => `<span style="transform:rotate(${i * 72 + 36}deg) translateY(-62px)">${p}%</span>`).join("")}</div></div>
   <p style="text-align:center;min-height:28px;font-size:18px;font-weight:800;margin-top:6px">${S.wheel_used ? (wLeft ? `${t("active")}: −${S.wp}% ${t("until")} ${fmtDate(S.wexp)}` : "") : ""}</p>
   <button class="btn ${S.wheel_used ? "" : "pulse"}" style="margin-top:8px" ${S.wheel_used ? "disabled" : ""} onclick="spin()">${t("spin")}</button></div>
  <div class="box"><h2>🤝 ${t("ref")}</h2><p class="mut">${t("refInfo")}</p>
   <div class="row"><input readonly value="${S.code}"><button class="btn alt" style="width:auto;margin:0" onclick="navigator.clipboard?.writeText('${S.code}');toast(t('copy'))">⧉</button></div>
   ${S.ref_by ? `<p class="mut" style="margin-top:8px">${S.ref ? "✅ " + t("refOn") : ""}</p>` : `<div class="row"><input id="rc" placeholder="${t("enter")}"><button class="btn" style="width:auto;margin:0" onclick="applyRef()">${t("apply")}</button></div>`}</div>`;
}
async function spin() {
  const j = await api("wheel"); if (j.err) return draw();
  const i = [10, 20, 30, 40, 50].indexOf(j.won);
  $("#wh").style.transform = `rotate(${360 * 5 + 360 - (i * 72 + 36)}deg)`;
  setTimeout(() => { toast("🎉 −" + j.won + "%"); confetti(); draw(); }, 3400);
}
async function applyRef() { const j = await api("ref", {code: $("#rc").value}); if (!j.err) { toast("✅"); confetti(); } draw(); }

async function openRev() { const j = await api("reviews"); R = {reviews: j.reviews || [], avg: j.avg}; go("rev"); }
function rev() {
  app.innerHTML = back() + `<h2 style="margin-bottom:8px">⭐ ${t("rev")}${R.avg != null ? ` · ${R.avg}/10` : ""}</h2>` +
  (S.bought ? `<div class="box"><p class="mut">${t("rating")}</p><input id="rt" type="number" min="0" max="10" step="0.1" inputmode="decimal" value="${S.mine?.rating ?? ""}">
    <p class="mut" style="margin-top:8px">${t("text")}</p><textarea id="rx" rows="2" maxlength="300">${esc(S.mine?.text ?? "")}</textarea>
    <button class="btn" style="margin-top:10px" onclick="sendRev()">${t("send")}</button></div>` : `<p class="note">${t("revLock")}</p>`) +
  (R.reviews.length ? R.reviews.map(r => `<div class="rev"><b>${r.rating.toFixed(1)}</b> · ${esc(r.name)}<br>${esc(r.text || "")}</div>`).join("") : `<p class="mut">${t("none")}</p>`);
}
async function sendRev() { const j = await api("review", {rating: $("#rt").value, text: $("#rx").value}); if (!j.err) { toast(t("saved")); confetti(); openRev(); } }

// ====== gothic atmosphere ======
const FX={int:+store("int",70),dust:store("dust","1")==="1",candle:store("candle","0")==="1",grain:store("grain","0")==="1"};
const calm=()=>document.documentElement.classList.contains("calm")||matchMedia("(prefers-reduced-motion:reduce)").matches;
const cv=$("#dust"),cx=cv.getContext("2d"),cd=$("#candle");let W,H,D,ps=[],col="224,192,104",raf,tx=.5,ty=.35,px=.5,py=.35;
const mk=i=>({x:Math.random()*W,y:i?Math.random()*H:H+12,r:(Math.random()*1.5+.4)*D,v:(Math.random()*.3+.1)*D,a:Math.random()*.6+.25,p:Math.random()*6.3,e:Math.random()<.2});
function size(){D=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*D;H=cv.height=innerHeight*D}
function tick(t){raf=requestAnimationFrame(tick);px+=(tx-px)*.05;py+=(ty-py)*.05;cd.style.transform=`translate3d(${px*innerWidth}px,${py*innerHeight}px,0)`;cx.clearRect(0,0,W,H);
  for(const q of ps){q.y-=q.v*(q.e?1.7:1);q.x+=Math.sin(t/2300+q.p)*.35*D;if(q.y<-12)Object.assign(q,mk());cx.fillStyle=`rgba(${q.e?"255,148,60":col},${q.a*(.55+.45*Math.sin(t/650+q.p))})`;cx.beginPath();cx.arc(q.x,q.y,q.r*(q.e?1.3:1),0,6.283);cx.fill()}}
function kick(){cancelAnimationFrame(raf);cx.clearRect(0,0,W,H);if(!calm()&&!document.hidden)raf=requestAnimationFrame(tick)}
function fx(){const r=document.documentElement;r.style.setProperty("--int",FX.int/100);r.classList.toggle("nocandle",!FX.candle);r.classList.toggle("nograin",!FX.grain);
  col=getComputedStyle(r).getPropertyValue("--rgb2").trim().split(/\s+/).join(",");const n=FX.dust?Math.round(10+70*FX.int/100):0;while(ps.length<n)ps.push(mk(1));ps.length=Math.min(ps.length,n);kick()}
size();addEventListener("resize",size);document.addEventListener("visibilitychange",kick);addEventListener("pointermove",e=>{tx=e.clientX/innerWidth;ty=e.clientY/innerHeight},{passive:true});
const _ap=applyPrefs;applyPrefs=function(){_ap();fx()};
function ink(){let n=0;app.querySelectorAll(".ptitle,.hero h2,.box h2,.big b").forEach(e=>{const s=e.dataset.t=e.dataset.t||e.textContent;
  e.innerHTML=s.split(" ").map(w=>`<span style="display:inline-block;white-space:nowrap">${Array.from(w).map(c=>`<i class="k" style="--i:${n++}">${esc(c)}</i>`).join("")}</span>`).join(" ")})}
const _dr=draw;draw=function(){_dr();document.body.dataset.v=view==="cat"?cat:view;if(app.classList.contains("enter"))ink()};
addEventListener("unveil",()=>{enter();ink()});
new MutationObserver(()=>document.querySelectorAll(".btn,.big").forEach(e=>{if(!e.style.getPropertyValue("--sd"))e.style.setProperty("--sd",-Math.random()*7+"s")})).observe(document.body,{childList:true,subtree:true});
const MG=".btn,.big,.links button,.th,#cog,.lang button,.back",RP=".btn,.big,.links button,.th,.back,.lang button";
document.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse"||calm())return;const el=e.target.closest?.(MG);if(!el)return;const r=el.getBoundingClientRect();el.style.setProperty("--mx",(e.clientX-r.left-r.width/2)/r.width*8+"px");el.style.setProperty("--my",(e.clientY-r.top-r.height/2)/r.height*6+"px")});
document.addEventListener("pointerout",e=>{const el=e.target.closest?.(MG);if(el&&!el.contains(e.relatedTarget)){el.style.setProperty("--mx","0px");el.style.setProperty("--my","0px")}});
document.addEventListener("pointerdown",e=>{const el=e.target.closest?.(RP);if(!el||calm())return;const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2.2,s=document.createElement("span");s.className="rip";
  s.style.cssText=`left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px;width:${d}px;height:${d}px`;el.append(s);s.animate([{transform:"scale(0)",opacity:.9},{transform:"scale(1)",opacity:0}],{duration:900,easing:"cubic-bezier(.2,.7,.2,1)"}).onfinish=()=>s.remove()});
for (const l of ["en", "ru"]) $("#" + l).onclick = () => { L = l; save("l", l); draw(); };
$("#cog").onclick = openSettings;
async function boot() {
  failed = false; draw(); await api("state"); failed = !S;
  if (S) { const j = await api("reviews"); R = {reviews: j.reviews || [], avg: j.avg}; }
  enter(); draw();
}
applyPrefs(); draw(); boot();
</script>
